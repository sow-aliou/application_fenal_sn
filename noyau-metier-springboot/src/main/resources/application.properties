spring.datasource.url=jdbc:postgresql://localhost:5432/fenal
spring.datasource.username=user
spring.datasource.password=password

spring.jpa.database-platform=org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Liquibase config
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.xml
spring.liquibase.enabled=true

# JWT secret
jwt.secret=secretsecretsecretsecretsecretsecretsecretsecretsecretsecret
jwt.expiration=86400000

server.port=8080
